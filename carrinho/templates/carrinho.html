<!DOCTYPE html>
<html>
<head>
    <title>Carrinho</title>
</head>
<body>
    <h1>Seu carrinho</h1>
    {% if produtos %}
        <ul>
            {% for p in produtos %}
                <li>{{ p['nome'] }} - {{ p['artista'] }} - R$ {{ p['preco'] }}</li>
            {% endfor %}
        </ul>
        <a href="/limpar">Limpar carrinho</a>
    {% else %}
        <p>O carrinho está vazio.</p>
    {% endif %}
    <a href="/">Voltar</a>
</body>
</html>
