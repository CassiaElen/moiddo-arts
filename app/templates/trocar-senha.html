<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha | Muiddo Arts</title>
    <meta name="description" content="Atualize sua senha de acesso à plataforma Muiddo Arts">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/bolhas.css">
    <link rel="stylesheet" href="../static/css/auth.css">

</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <!-- Container das bolhas decorativas -->
    <div class="bg-bolhas">
        <div class="bolha"></div>
        <div class="bolha"></div>
        <div class="bolha"></div>
        <div class="bolha"></div>
        <div class="bolha"></div>
        <div class="bolha"></div>
        <div class="bolha"></div>
        <div class="bolha"></div>
    </div>


    <div class="auth-container w-full max-w-md rounded-xl shadow-2xl overflow-hidden border border-[#536340]/10">
        <!-- Cabeçalho -->
        <div class="bg-[#536340] text-white p-8 text-center">
            <p class="mb-8">Muiddo Arts</p>
            <h1 class="text-2xl font-bold mb-2">Atualizar Senha</h1>
            <p class="opacity-90">Crie uma nova senha segura</p>
        </div>
        <!-- Formulário -->
        <form action="{{ url_for('main.trocar_senha') }}" method="POST" class="p-8" id="passwordForm">
            <div class="space-y-4">
                <!-- Senha Atual (apenas se já estiver logado) -->

                <div class="form-control">
                    <label class="label" for="current_password">
                        <span class="label-text text-[#2C3C1C]">Senha Atual</span>
                    </label>
                    <div class="relative">
                        <input id="current_password" name="current_password" type="password" required
                            class="input input-bordered w-full pr-10" placeholder="Sua senha atual">
                        <span class="absolute right-3 top-3 text-[#536340] password-toggle"
                            onclick="togglePassword('current_password')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>


                <!-- Nova Senha -->
                <div class="form-control">
                    <label class="label" for="new_password">
                        <span class="label-text text-[#2C3C1C]">Nova Senha</span>
                    </label>
                    <div class="relative">
                        <input id="new_password" name="new_password" type="password" required
                            class="input input-bordered w-full pr-10" placeholder="Crie uma nova senha"
                            oninput="checkPasswordStrength(this.value)">
                        <span class="absolute right-3 top-3 text-[#536340] password-toggle"
                            onclick="togglePassword('new_password')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <div class="mt-1">
                        <div class="flex justify-between mb-1">
                            <span class="text-xs text-gray-500">Força da senha:</span>
                            <span class="text-xs font-medium" id="strengthText">Fraca</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                            <div class="password-strength bg-red-500 rounded-full h-1.5" id="passwordStrength"
                                style="width: 20%"></div>
                        </div>
                    </div>
                    <ul class="text-xs text-gray-500 mt-2 list-disc pl-5">
                        <li>Mínimo de 8 caracteres</li>
                        <li>Pelo menos 1 número</li>
                        <li>Pelo menos 1 caractere especial</li>
                    </ul>
                </div>

                <!-- Confirmar Nova Senha -->
                <div class="form-control">
                    <label class="label" for="confirm_password">
                        <span class="label-text text-[#2C3C1C]">Confirmar Nova Senha</span>
                    </label>
                    <div class="relative">
                        <input id="confirm_password" name="confirm_password" type="password" required
                            class="input input-bordered w-full pr-10" placeholder="Repita a nova senha">
                        <span class="absolute right-3 top-3 text-[#536340] password-toggle"
                            onclick="togglePassword('confirm_password')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <div class="text-xs text-red-500 mt-1 hidden" id="passwordMatchError">
                        As senhas não coincidem
                    </div>
                </div>

                <div class="pt-6">
                    <button type="submit" class="btn btn-primary-custom text-white w-full" id="submitBtn">
                        Atualizar Senha
                    </button>
                </div>

                <div class="text-center text-sm text-[#536340] mt-4">
                    <a href="{{ url_for('main.logout') }}" class="font-semibold hover:underline">
                        <i class="fas fa-arrow-left mr-1"></i> Voltar
                    </a>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Alternar entre mostrar/esconder senha
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = field.nextElementSibling.querySelector('i');

            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Verificar força da senha
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('passwordStrength');
            const strengthText = document.getElementById('strengthText');
            let strength = 0;

            // Verificar comprimento
            if (password.length >= 8) strength += 1;
            if (password.length >= 12) strength += 1;

            // Verificar caracteres diversos
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;

            // Atualizar barra e texto
            let width = 20;
            let color = 'bg-red-500';
            let text = 'Fraca';

            if (strength >= 4) {
                width = 80;
                color = 'bg-yellow-500';
                text = 'Boa';
            }
            if (strength >= 5) {
                width = 100;
                color = 'bg-green-500';
                text = 'Forte';
            }

            strengthBar.style.width = `${width}%`;
            strengthBar.className = `password-strength ${color} rounded-full h-1.5`;
            strengthText.textContent = text;
        }

        // Validar se as senhas coincidem
        document.getElementById('passwordForm').addEventListener('submit', function (e) {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorElement = document.getElementById('passwordMatchError');

            if (newPassword !== confirmPassword) {
                e.preventDefault();
                errorElement.classList.remove('hidden');
                document.getElementById('confirm_password').classList.add('input-error');
            } else {
                errorElement.classList.add('hidden');
                document.getElementById('confirm_password').classList.remove('input-error');
            }
        });

        // Validar em tempo real enquanto digita
        document.getElementById('confirm_password').addEventListener('input', function () {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = this.value;
            const errorElement = document.getElementById('passwordMatchError');

            if (confirmPassword.length > 0 && newPassword !== confirmPassword) {
                errorElement.classList.remove('hidden');
                this.classList.add('input-error');
            } else {
                errorElement.classList.add('hidden');
                this.classList.remove('input-error');
            }
        });

    </script>
</body>

</html>
