<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Artista | Muiddo Arts</title>
  <meta name="description" content="Cadastre-se como artista na Muiddo Arts para compartilhar suas obras com o mundo.">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../static/css/bolhas.css">
  <link rel="stylesheet" href="../static/css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4">
  <!-- Container das bolhas decorativas -->
  <div class="bg-bolhas">
    <div class="bolha"></div>
    <div class="bolha"></div>
    <div class="bolha"></div>
    <div class="bolha"></div>
    <div class="bolha"></div>
    <div class="bolha"></div>
    <div class="bolha"></div>
    <div class="bolha"></div>
  </div>

  <main class="conteudo auth-container w-full max-w-md rounded-xl shadow-2xl overflow-hidden border border-[#536340]/10">
    <!-- Cabeçalho -->
    <div class="bg-[#536340] text-white p-8 text-center">
      <p class="mb-8">Muiddo Arts</p>
      <h1 class="text-2xl font-bold mb-2">Cadastro de Artista</h1>
      <p class="opacity-90">Preencha seus dados para criar sua conta</p>
    </div>

    
    <!-- Formulário -->
    <form action="{{ url_for('main.register_artist') }}" method="POST" class="p-6">
      <div class="space-y-4">
        <div class="form-control">
          <label class="label" for="email">
            <span class="label-text text-[#2C3C1C]">E-Mail</span>
          </label>
          <div class="relative">
            <input id="email" name="email" type="email" required class="input-field input input-bordered w-full pl-10"
              placeholder="exemplo@email.com">
            <span class="absolute left-3 top-3 text-[#2C3C1C]">
              <i class="fas fa-envelope"></i>
            </span>
          </div>
        </div>

        <div class="form-control">
          <label class="label" for="name">
            <span class="label-text text-[#2C3C1C]">Nome Completo</span>
          </label>
          <div class="relative">
            <input id="name" name="name" type="text" required class="input-field input input-bordered w-full pl-10"
              placeholder="João da Silva">
            <span class="absolute left-3 top-3 text-[#2C3C1C]">
              <i class="fas fa-user"></i>
            </span>
          </div>
        </div>

        <div class="form-control">
          <label class="label" for="username">
            <span class="label-text text-[#2C3C1C]">Nome de Usuário</span>
          </label>
          <div class="relative">
            <input id="username" name="user" type="text" required class="input-field input input-bordered w-full pl-10"
              placeholder="joao_artista">
            <span class="absolute left-3 top-3 text-[#2C3C1C]">
              <i class="fas fa-at"></i>
            </span>
          </div>
        </div>

        <div class="form-control">
          <label class="label" for="cpf">
            <span class="label-text text-[#2C3C1C]">CPF/CNPJ</span>
          </label>
          <div class="relative">
            <input id="cpf" name="cpf" type="text" required class="input-field input input-bordered w-full pl-10"
              placeholder="000.000.000-00 ou 00.000.000/0001-00">
            <span class="absolute left-3 top-3 text-[#2C3C1C]">
              <i class="fas fa-id-card"></i>
            </span>
          </div>
        </div>

        <div class="form-control">
          <label class="label" for="password">
            <span class="label-text text-[#2C3C1C]">Senha</span>
          </label>
          <div class="relative">
            <input id="password" name="password" type="password" required
              class="input-field input input-bordered w-full pl-10" placeholder="Crie uma senha segura">
            <span class="absolute left-3 top-3 text-[#2C3C1C]">
              <i class="fas fa-lock"></i>
            </span>
          </div>
          <ul class="text-xs text-gray-500 mt-2 list-disc pl-5">
            <li>Mínimo de 8 caracteres</li>
            <li>Pelo menos 1 número</li>
            <li>Pelo menos 1 caractere especial</li>
          </ul>
        </div>

        <div class="pt-4">
          <button type="submit" class="btn btn-primary-custom text-white w-full">
            Cadastrar
          </button>
        </div>

        <div class="text-center text-sm text-[#536340] mt-4">
          <p>Já tem uma conta? <a href="{{url_for('main.login_artist') }}" class="font-semibold hover:underline">Faça
              login</a></p>
        </div>
      </div>
    </form>
  </main>
</body>

</html>
